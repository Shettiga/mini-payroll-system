<!DOCTYPE html>
<html>
<head>
    <title>View Employees</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Employee List</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Designation</th>
            <th>Department</th>
            <th>Action</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row.emp_id }}</td>
            <td>{{ row.name }}</td>
            <td>{{ row.designation }}</td>
            <td>{{ row.department }}</td>
            <td>
                <a href="/delete_employee/{{ row.emp_id }}"
                   onclick="return confirm('Are you sure you want to delete this employee?');"
                   class="delete-btn">
                   Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/dashboard" class="btn">Back to Dashboard</a>
</div>

</body>
</html>
